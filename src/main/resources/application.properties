spring.application.name=WebAuth

# Carga opcional del archivo .env en desarrollo local.
spring.config.import=optional:file:.env[.properties]

# ---- Base de datos (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-self-ten-51.vercel.app,https://*.vercel.app,http://localhost:*}

# ---- Servidor ----
server.port=${PORT:8081}

# ---- Observabilidad (Actuator + Prometheus) ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
