spring.application.name=WebAuth

# Carga opcional del archivo .env en desarrollo local.
spring.config.import=optional:file:.env[.properties]

# ---- Base de datos (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (conexión privada con el front) ----
# URL(s) exactas del front separadas por coma, ej. https://mi-front.com,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---- Servidor ----
server.port=${PORT:8081}
